name: GamepadMouse
options:
  minimumXcodeGenVersion: "2.30"
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "14.0"
  generateEmptyDirectories: true

packages:
  TOMLDecoder:
    url: https://github.com/dduan/TOMLDecoder.git
    from: "0.4.0"

targets:
  GamepadMouse:
    type: application
    platform: macOS
    sources:
      - GamepadMouse
    resources:
      - path: GamepadMouse/Resources
    dependencies:
      - package: TOMLDecoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamepad-mouse.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.7"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ARCHS: "$(ARCHS_STANDARD)"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ALLOW_PROVISIONING_UPDATES: YES
        INFOPLIST_FILE: GamepadMouse/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
